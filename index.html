                const searchTerm = $('#customSearchInput').val().trim();
                const typeFilter = $('#typeFilterSelect').val();
                const formFilter = $('#formFilterSelect').val();
                let nameMatch = true;
                if (searchTerm !== '') {
                    const searchKana = hiraToKana(searchTerm);
                    nameMatch = pokeInfo.name.startsWith(searchKana) || pokeInfo.name.startsWith(searchTerm);
                }
                let typeMatch = true;
                if (typeFilter !== 'all') { typeMatch = (pokeInfo.type === typeFilter); }
                let formMatch = true;
                if (formFilter === 'none') { formMatch = (pokeInfo.regional !== '〇' && pokeInfo.mega !== '〇' && pokeInfo.gmax !== '〇'); }

                    let count = (pokeInfo.regional === '〇' ? 1 : 0) + (pokeInfo.mega === '〇' ? 1 : 0) + (pokeInfo.gmax === '〇' ? 1 : 0);

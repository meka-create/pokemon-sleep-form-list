                const typeFilter = $('#typeFilterSelect').val();
                const formFilter = $('#formFilterSelect').val();

                }

                    nameMatch = pokeInfo.name.startsWith(searchKana) || pokeInfo.name.startsWith(searchTerm);
                }
                
                let typeMatch = true;
                if (typeFilter !== 'all') { typeMatch = (pokeInfo.type === typeFilter); }
